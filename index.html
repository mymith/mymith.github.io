<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overfly Games</title>
<style>
  :root { --bg:#0e1230; --card:#1a2050; --text:#eef0ff; --muted:#a9b0e0; --accent:#ffcf3f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  main { max-width:520px; width:100%; background:var(--card); border-radius:20px; padding:32px 24px; text-align:center; }
  h1 { margin:0 0 4px; font-size:28px; }
  .studio { color:var(--muted); margin:0 0 24px; }
  h2 { margin:0 0 8px; font-size:22px; color:var(--accent); }
  p { line-height:1.5; }
  a.button { display:inline-block; margin:16px 0 8px; padding:12px 24px; border-radius:12px;
             background:var(--accent); color:#1a1a1a; font-weight:700; text-decoration:none; }
  .links { margin-top:24px; font-size:14px; color:var(--muted); }
  .links a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Overfly Games</h1>
  <p class="studio">Independent mobile game studio</p>
  <h2>Space Smash</h2>
  <p>Blast planets layer by layer, all the way to the core.</p>
  <a class="button" href="https://play.google.com/store/apps/details?id=com.overflygames.spacesmash">Get it on Google Play</a>
  <div class="links">
    <a href="https://docs.google.com/document/d/e/2PACX-1vRfAvqGwgKAem_uSQ5mf7mRkmA9pH8aC7G2hpXj4RhLX1filJhhgN1PbZu8wxzf9afU22Hbngf7nAp7/pub">Privacy Policy</a>
    &nbsp;·&nbsp;
    <a href="mailto:overflygames.support@gmail.com">overflygames.support@gmail.com</a>
  </div>
</main>
</body>
</html>
